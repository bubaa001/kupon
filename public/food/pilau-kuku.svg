<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Pilau rice with a roasted chicken drumstick">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3a1c12"/><stop offset="1" stop-color="#170a06"/>
    </linearGradient>
    <radialGradient id="plate" cx=".42" cy=".3" r=".8">
      <stop stop-color="#faf4e6"/><stop offset="1" stop-color="#d8cdb6"/>
    </radialGradient>
    <linearGradient id="rice" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c98f42"/><stop offset="1" stop-color="#87501e"/>
    </linearGradient>
    <linearGradient id="chicken" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e09a4c"/><stop offset=".5" stop-color="#ad5f27"/><stop offset="1" stop-color="#6d3413"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#120603" flood-opacity=".65"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#2a1004" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="336" cy="56" r="80" fill="#f59e0b" opacity=".12"/>
  <circle cx="60" cy="250" r="92" fill="#dc2626" opacity=".08"/>
  <ellipse cx="200" cy="258" rx="142" ry="22" fill="#100503" opacity=".62"/>
  <g filter="url(#s)">
    <ellipse cx="200" cy="160" rx="134" ry="105" fill="url(#plate)"/>
    <ellipse cx="200" cy="160" rx="113" ry="86" fill="#f1e9d5"/>
  </g>
  <ellipse cx="200" cy="104" rx="86" ry="26" fill="#ded2b9" opacity=".55"/>

  <!-- rice mound -->
  <path d="M118 178c-8-44 30-72 82-72 54 0 88 28 79 74-7 34-38 52-84 51-45-1-70-20-77-53Z" fill="url(#rice)"/>
  <!-- individual rice grains -->
  <g stroke="#e8bb7c" stroke-width="2.6" stroke-linecap="round" opacity=".75">
    <path d="M138 162l13-5"/><path d="M156 148l14-5"/><path d="M178 138l13-4"/><path d="M200 134l14-2"/>
    <path d="M224 136l14 3"/><path d="M246 146l13 5"/><path d="M260 162l13 6"/><path d="M146 178l14 5"/>
    <path d="M170 172l14 4"/><path d="M194 168l14 3"/><path d="M218 172l14 4"/><path d="M242 178l13 6"/>
    <path d="M154 198l14 4"/><path d="M180 200l14 3"/><path d="M206 200l14 2"/><path d="M232 202l13 3"/>
    <path d="M258 192l12 4"/><path d="M126 190l12 3"/>
  </g>
  <g stroke="#6d3f14" stroke-width="2.2" stroke-linecap="round" opacity=".7">
    <path d="M148 154l12-4"/><path d="M170 144l12-3"/><path d="M192 140l13-2"/><path d="M216 142l13 2"/>
    <path d="M238 150l12 3"/><path d="M256 168l11 5"/><path d="M160 186l13 4"/><path d="M188 182l13 3"/>
    <path d="M214 184l13 3"/><path d="M240 190l12 4"/><path d="M172 208l13 2"/><path d="M200 210l13 1"/>
  </g>
  <!-- caramelised onion strands -->
  <g stroke="#f0b45c" stroke-width="3" stroke-linecap="round" opacity=".8">
    <path d="M150 166c8-6 18-8 26-4"/><path d="M226 158c9-5 19-4 26 2"/><path d="M188 196c9-5 19-4 27 0"/>
  </g>
  <!-- tomato / carrot flecks -->
  <g fill="#f97316">
    <circle cx="156" cy="184" r="5.5"/><circle cx="234" cy="170" r="5"/><circle cx="198" cy="188" r="4.5"/><circle cx="262" cy="196" r="4"/>
  </g>
  <g fill="#22c55e">
    <path d="M166 138c7-9 16-11 20-5 4 5 0 12-8 15-8 3-16-1-12-10Z"/>
    <path d="M222 132c6-8 14-9 18-4 3 4-1 11-8 14-7 2-14-2-10-10Z"/>
  </g>

  <!-- roasted chicken pieces -->
  <g filter="url(#soft)">
    <path d="M226 158c-18-10-22-38-4-54 18-16 46-16 60 2 12 15 7 38-10 48-15 9-33 10-46 4Z" fill="url(#chicken)"/>
    <path d="M276 122l26-20" stroke="#f8f1e2" stroke-width="10" stroke-linecap="round"/>
    <circle cx="307" cy="97" r="9" fill="#f8f1e2"/>
    <circle cx="295" cy="87" r="7" fill="#f1e8d5"/>
    <path d="M196 202c-12-8-10-28 6-37 16-9 36-4 43 9 7 14-3 30-19 34-13 3-24 0-30-6Z" fill="url(#chicken)"/>
  </g>
  <!-- roast marks + crispy edge -->
  <g fill="none" stroke="#5f2c0e" stroke-width="3.2" stroke-linecap="round" opacity=".5">
    <path d="M240 114c10-4 20-4 29 1"/><path d="M226 190c9-4 19-4 27 1"/>
  </g>
  <path d="M236 130c12-8 28-10 40-4" fill="none" stroke="#f3c58b" stroke-width="6" stroke-linecap="round" opacity=".55"/>
  <path d="M204 190c9-5 19-6 27-3" fill="none" stroke="#f3c58b" stroke-width="5" stroke-linecap="round" opacity=".5"/>
  <g fill="#fbbf24"><circle cx="205" cy="112" r="2.6"/><circle cx="286" cy="150" r="2.4"/><circle cx="132" cy="196" r="2.2"/></g>
</svg>
