  <g fill="#f97316"><circle cx="206" cy="120" r="4"/><circle cx="172" cy="196" r="3.4"/><circle cx="280" cy="170" r="3"/></g>
  <g fill="#fbbf24">
    <circle cx="210" cy="212" r="2.8"/><circle cx="120" cy="176" r="2.6"/><circle cx="266" cy="134" r="2.4"/>
  </g>
</svg>
