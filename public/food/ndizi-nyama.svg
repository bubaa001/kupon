  <!-- greens, carrot, chilli oil -->
  <g fill="#3f9e63">
    <path d="M166 108c9-13 21-16 27-8 5 6 0 15-11 20-11 5-21 1-16-12Z"/>
    <path d="M266 112c8-11 19-13 24-5 4 6-1 14-11 18-10 3-18-3-13-13Z"/>
    <path d="M264 196c7-9 16-11 20-5 3 5-1 11-8 14-7 2-15-1-12-9Z"/>
