<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Ndizi nyama: green banana and beef stew on a plate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#243016"/><stop offset="1" stop-color="#0d1208"/>
    </linearGradient>
    <radialGradient id="plate" cx=".42" cy=".3" r=".8">
      <stop stop-color="#fbf8ef"/><stop offset="1" stop-color="#d6d2bf"/>
    </radialGradient>
    <linearGradient id="banana" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2e9a4"/><stop offset=".55" stop-color="#dfd074"/><stop offset="1" stop-color="#b8a849"/>
    </linearGradient>
    <linearGradient id="beef" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a2612e"/><stop offset="1" stop-color="#5f3217"/>
    </linearGradient>
    <radialGradient id="stew" cx=".45" cy=".4" r=".75">
      <stop stop-color="#7a4118"/><stop offset="1" stop-color="#4a250f"/>
    </radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#060903" flood-opacity=".62"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1a1204" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="340" cy="52" r="82" fill="#a3e635" opacity=".1"/>
  <circle cx="58" cy="256" r="90" fill="#fbbf24" opacity=".08"/>
  <ellipse cx="200" cy="258" rx="142" ry="22" fill="#050802" opacity=".6"/>
  <g filter="url(#s)">
    <ellipse cx="200" cy="160" rx="134" ry="105" fill="url(#plate)"/>
    <ellipse cx="200" cy="160" rx="113" ry="86" fill="#f2efe2"/>
  </g>
  <ellipse cx="200" cy="104" rx="88" ry="27" fill="#dedbc8" opacity=".55"/>

  <!-- rich stew pool -->
  <ellipse cx="200" cy="178" rx="88" ry="48" fill="url(#stew)"/>
  <ellipse cx="200" cy="176" rx="80" ry="41" fill="#753d16" opacity=".85"/>
  <g stroke="#b4783a" stroke-width="3" stroke-linecap="round" opacity=".4">
    <path d="M148 168c14-10 30-14 46-12"/><path d="M214 202c16-4 30-12 38-24"/><path d="M154 196c14 8 30 10 44 8"/>
  </g>

  <!-- banana chunks -->
  <g filter="url(#soft)" fill="url(#banana)">
    <path d="M150 152c-10-12-2-26 15-26 18 0 27 12 21 24-7 13-27 15-36 2Z"/>
    <path d="M228 146c-6-14 8-25 24-20 17 5 20 21 9 30-11 9-28 3-33-10Z"/>
    <path d="M182 206c-8-12 3-24 18-22 16 2 22 15 14 24-9 10-26 9-32-2Z"/>
  </g>
  <g fill="#f8f2c4" opacity=".6">
    <path d="M158 144c4-6 12-7 17-3 3 3 2 7-2 9-5 3-13 1-15-6Z"/>
    <path d="M238 142c4-6 12-7 17-3 3 3 2 7-2 9-5 3-12 1-15-6Z"/>
    <path d="M190 198c4-5 10-6 14-2 2 2 1 6-2 7-4 2-10 0-12-5Z"/>
  </g>
  <g stroke="#a4954a" stroke-width="2.2" stroke-linecap="round" opacity=".7">
    <path d="M162 162c8-4 18-5 26-2"/><path d="M240 160c8-4 18-3 25 2"/><path d="M192 214c8-3 16-3 23 1"/>
  </g>

  <!-- beef chunks -->
  <g filter="url(#soft)" fill="url(#beef)">
    <path d="M176 172c-9-14 3-29 21-26 18 3 23 19 13 31-9 12-27 8-34-5Z"/>
    <path d="M222 186c-7-12 3-24 18-21 16 3 19 17 10 27-8 9-23 5-28-6Z"/>
    <path d="M136 190c-6-10 3-20 15-18 13 3 16 14 9 22-7 8-20 4-24-4Z"/>
    <path d="M216 152c-5-8 3-16 12-14 11 2 13 11 7 17-6 7-15 4-19-3Z"/>
  </g>
  <g fill="#c58a52" opacity=".5">
    <path d="M184 162c4-5 11-6 16-2 3 3 2 7-2 8-5 3-12 1-14-6Z"/>
    <path d="M229 176c4-5 10-5 14-1 3 3 1 7-3 8-4 2-9-1-11-7Z"/>
    <path d="M145 183c3-4 8-4 11-1 2 2 1 5-2 6-3 2-8 0-9-5Z"/>
