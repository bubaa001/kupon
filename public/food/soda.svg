    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7f1d1d"/><stop offset=".5" stop-color="#ef4444"/><stop offset="1" stop-color="#7f1d1d"/></linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0f2fe"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#140303" flood-opacity=".65"/></filter>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#bg)"/>
